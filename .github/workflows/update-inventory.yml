name: Update inventory

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:         # lets you click "Run workflow" manually

permissions:
  contents: write

concurrency:
  group: update-inventory
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pillow numpy scipy "rembg[cpu]"

      - name: Install car detector (optional)
        continue-on-error: true
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install ultralytics
          pip uninstall -y opencv-python || true
          pip install opencv-python-headless

      - name: Build inventory
        run: python update_inventory.py

      - name: Commit changes
        run: |
          git config user.name "inventory-bot"
          git config user.email "inventory-bot@users.noreply.github.com"
          git add -A auto_executive_test_inventory.json photos photo_cache.json preview.jpg
          if [ -d debug ]; then git add -A debug; fi
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update inventory"
            git push
          fi
